      function reducer(state, action) {

        if (action.type === "addTask") return { ...state, tasks: [{ id: Date.now(), done: false, ...action.task }, ...state.tasks] };

        if (action.type === "toggleTask") return { ...state, tasks: state.tasks.map(t => t.id === action.id ? { ...t, done: !t.done } : t) };
        if (action.type === "deleteClient") return { ...state, clients: state.clients.filter(c => c.id !== action.id) };
        if (action.type === "deleteTask") return { ...state, tasks: state.tasks.filter(t => t.id !== action.id) };
        if (action.type === "deleteInvoice") return { ...state, invoices: state.invoices.filter(i => i.id !== action.id) };
        if (action.type === "deletePost") return { ...state, posts: state.posts.filter(p => p.id !== action.id) };
        if (action.type === "updateClient") return { ...state, clients: state.clients.map(c => c.id === action.id ? { ...c, ...action.data } : c) };
        if (action.type === "updateTask") return { ...state, tasks: state.tasks.map(t => t.id === action.id ? { ...t, ...action.data } : t) };
        if (action.type === "updateInvoice") return { ...state, invoices: state.invoices.map(i => i.id === action.id ? { ...i, ...action.data } : i) };

        if (action.type === "updateUser") return users.map(u => u.id === action.id ? { ...u, ...action.data } : u);
        if (action.type === "deleteUser") return users.filter(u => u.id !== action.id);
        if (action.type === "setStatus") return users.map(u => u.id === action.id ? { ...u, status: action.status } : u);
        if (action.type === "blockUser") return users.map(u => u.id === action.id ? { ...u, status: "inactivo" } : u);

        if (action.type === "resetPassword") return users.map(u => u.id === action.id ? { ...u, password: action.newPassword } : u);
        if (action.type === "updateLastLogin") return users.map(u => u.id === action.id ? { ...u, lastLogin: action.timestamp } : u);

                  <div className="text-sm text-cream/65 mt-1">Tu panel está listo. Comienza creando tu primer cliente desde la sección <strong className="text-gold">Clientes</strong>.</div>

            </div>
            <div className="grid gap-5 xl:grid-cols-[1.4fr_.6fr]">

      function Clients({ clients, shell, setModal, dispatch, notify }) {
        const [query, setQuery] = useState("");
        const [status, setStatus] = useState("Todos");
        const [deleteConfirm, setDeleteConfirm] = useState(null);
        const filtered = clients.filter(c => (status === "Todos" || c.status === status) && `${c.name} ${c.company} ${c.service}`.toLowerCase().includes(query.toLowerCase()));
        
        const handleDelete = (id, name) => {
          if (deleteConfirm === id) {
            dispatch({ type: "deleteClient", id });
            notify(`Cliente ${name} eliminado`, "success");
            setDeleteConfirm(null);
          } else {
            setDeleteConfirm(id);
            setTimeout(() => setDeleteConfirm(null), 3000);
          }
        };
        
        return (
          <div className="space-y-5">
            <Card shell={shell}>
              <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
                <div className="flex flex-1 items-center gap-2 rounded-lg border border-gold/20 px-3 py-2"><Search size={18} className="text-gold"/><input value={query} onChange={e => setQuery(e.target.value)} className="w-full bg-transparent text-sm outline-none placeholder:text-cream/40" placeholder="Buscar cliente, empresa o servicio" /></div>
                <div className="flex flex-wrap gap-2">
                  {["Todos", "Activo", "Prospecto", "Pausado", "Finalizado"].map(s => <button key={s} onClick={() => setStatus(s)} className={`rounded-lg border px-3 py-2 text-sm font-bold ${status === s ? "border-gold bg-gold text-[#120a00]" : "border-gold/20 text-gold"}`}>{s}</button>)}
                  <button onClick={() => setModal("client")} className="inline-flex items-center gap-2 rounded-lg bg-gold px-3 py-2 text-sm font-bold text-[#120a00]"><Plus size={16}/>Añadir</button>
                </div>
              </div>
            </Card>
            {filtered.length === 0 ? (
              <Card shell={shell} className="py-12 text-center">
                <div className="text-cream/40 text-sm">No se encontraron clientes con los filtros actuales.</div>
              </Card>
            ) : (
              <div className="grid gap-4 xl:grid-cols-2">
                {filtered.map(client => <Card key={client.id} shell={shell}><div className="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between"><div className="flex gap-3"><Avatar label={client.avatar}/><div><div className="flex flex-wrap items-center gap-2"><h3 className="font-extrabold">{client.name}</h3><Badge label={client.status}/></div><p className="text-sm text-cream/65">{client.company}</p><p className="mt-1 text-sm font-semibold text-gold">{client.service}</p></div></div><div className="text-left sm:text-right"><div className="text-2xl font-extrabold">{client.status === "Prospecto" ? "Presupuesto" : euro.format(client.value)}</div><div className="text-xs text-cream/55">valor mensual</div></div></div><div className="mt-4 grid gap-3 border-t border-gold/15 pt-4 sm:grid-cols-3"><Info label="Email" value={client.email}/><Info label="Teléfono" value={client.phone}/><Info label="Pagos" value={client.payments[0]}/></div><p className="mt-4 rounded-lg bg-gold/8 p-3 text-sm text-cream/70">{client.notes}</p><div className="mt-4 flex justify-end gap-2"><button onClick={() => setModal({ type: "editClient", client })} className="rounded-lg border border-gold/20 px-3 py-2 text-sm font-bold text-gold hover:bg-gold/10">Editar</button><button onClick={() => handleDelete(client.id, client.name)} className={`rounded-lg px-3 py-2 text-sm font-bold ${deleteConfirm === client.id ? "bg-rose-400 text-black" : "border border-rose-400/30 text-rose-300 hover:bg-rose-400/10"}`}>{deleteConfirm === client.id ? "¿Confirmar?" : "Eliminar"}</button></div></Card>)}
              </div>
            )}
          </div>
        );
      }

      function Projects({ projects, shell }) {
        const columns = ["Pendiente", "En progreso", "Revisión", "Completado"];
        return (
          <div className="space-y-5">
            <Card shell={shell}><div className="flex flex-wrap items-center justify-between gap-3"><div className="flex items-center gap-2 text-sm font-bold text-gold"><Filter size={17}/>Filtros activos: todos los clientes · todos los servicios</div><button className="rounded-lg border border-gold/25 px-3 py-2 text-sm font-bold text-gold">Ordenar por entrega <ChevronDown size={14} className="inline"/></button></div></Card>
            <div className="grid gap-4 xl:grid-cols-4">
              {columns.map(col => <div key={col} className={`rounded-lg border border-gold/18 ${shell} p-3`}><div className="mb-3 flex items-center justify-between"><h3 className="font-extrabold">{col}</h3><span className="rounded-full bg-gold/10 px-2 py-1 text-xs font-bold text-gold">{projects.filter(p => p.status === col).length}</span></div><div className="space-y-3">{projects.filter(p => p.status === col).map(p => <ProjectCard key={p.id} project={p}/>)}</div></div>)}
            </div>
          </div>
        );
      }

      function ProjectCard({ project }) {
        return (
          <article className="rounded-lg border border-gold/15 bg-black/10 p-3 transition hover:border-gold/40">
            <div className="flex justify-between gap-2"><h4 className="text-sm font-extrabold leading-5">{project.title}</h4><MoreHorizontal size={16} className="text-gold"/></div>
            <p className="mt-2 text-xs text-cream/55">{project.client} · {project.service}</p>
            <div className="mt-3 flex flex-wrap gap-2"><Priority label={project.priority}/><span className="rounded-full bg-gold/10 px-2 py-1 text-xs font-bold text-gold">{project.owner}</span></div>
            <div className="mt-4"><div className="mb-1 flex justify-between text-xs"><span>{project.due}</span><span>{project.progress}%</span></div><div className="h-2 rounded-full bg-gold/10"><div className="h-2 rounded-full bg-gold" style={{ width: `${project.progress}%` }} /></div></div>
          </article>
        );
      }

      function Billing({ invoices, shell, notify, setModal, dispatch }) {
        const total = invoices.reduce((s, i) => s + i.amount, 0);
        const paid = invoices.filter(i => i.status === "Pagada").reduce((s, i) => s + i.amount, 0);
        const [deleteConfirm, setDeleteConfirm] = useState(null);
        
        const handleDelete = (id, client) => {
          if (deleteConfirm === id) {
            dispatch({ type: "deleteInvoice", id });
            notify(`Factura ${id} eliminada`, "success");
            setDeleteConfirm(null);
          } else {
            setDeleteConfirm(id);
            setTimeout(() => setDeleteConfirm(null), 3000);
          }
        };
        
        return (
          <div className="space-y-5">
            <div className="grid gap-4 md:grid-cols-3"><Card shell={shell}><MiniStat title="Total facturado" value={euro.format(total)} /></Card><Card shell={shell}><MiniStat title="Cobrado" value={euro.format(paid)} tone="green"/></Card><Card shell={shell}><MiniStat title="Pendiente" value={euro.format(total - paid)} tone="red"/></Card></div>
            <div className="grid gap-5 xl:grid-cols-[1.25fr_.75fr]">
              <Card shell={shell}><SectionTitle title="Facturas" action={<button onClick={() => setModal("invoice")} className="rounded-lg bg-gold px-3 py-2 text-sm font-bold text-[#120a00]">Crear factura</button>} />{invoices.length === 0 ? <div className="py-8 text-center text-cream/40 text-sm">No hay facturas registradas</div> : <div className="overflow-x-auto"><table className="w-full min-w-[680px] text-left text-sm"><thead className="text-cream/50"><tr><th className="py-3">Número</th><th>Cliente</th><th>Importe</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>{invoices.map(i => <tr key={i.id} className="border-t border-gold/12"><td className="py-3 font-bold">{i.id}</td><td>{i.client}</td><td className="font-extrabold">{euro.format(i.amount)}</td><td>{i.date}</td><td><Badge label={i.status}/></td><td className="flex gap-2"><button onClick={() => notify(`Factura ${i.id} exportada`)} className="rounded-lg border border-gold/20 p-2 text-gold" title="Exportar"><Download size={16}/></button><button onClick={() => handleDelete(i.id, i.client)} className={`rounded-lg p-2 ${deleteConfirm === i.id ? "bg-rose-400 text-black" : "border border-rose-400/30 text-rose-300 hover:bg-rose-400/10"}`} title={deleteConfirm === i.id ? "¿Confirmar?" : "Eliminar"}><X size={16}/></button></td></tr>)}</tbody></table></div>}</Card>
              <Card shell={shell}><SectionTitle title="Ingresos por servicio" /><Donut data={serviceData}/></Card>
            </div>
          </div>
        );
      }

      function CalendarTasks({ tasks, shell, dispatch, setModal, notify }) {
        const days = Array.from({ length: 30 }, (_, i) => i + 1);
        const marked = [3, 5, 7, 10, 15, 22];
        const [deleteConfirm, setDeleteConfirm] = useState(null);
        
        const handleDelete = (id, text) => {
          if (deleteConfirm === id) {
            dispatch({ type: "deleteTask", id });
            notify(`Tarea eliminada`, "success");
            setDeleteConfirm(null);
          } else {
            setDeleteConfirm(id);
            setTimeout(() => setDeleteConfirm(null), 3000);
          }
        };
        
        return (
          <div className="grid gap-5 xl:grid-cols-[.9fr_1.1fr]">
            <Card shell={shell}><SectionTitle title={`${new Date().toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })}`} /><div className="grid grid-cols-7 gap-2 text-center text-sm">{["L","M","X","J","V","S","D"].map(d => <div key={d} className="py-2 text-xs font-bold text-gold">{d}</div>)}{days.map(d => <div key={d} className={`min-h-16 rounded-lg border p-2 ${marked.includes(d) ? "border-gold/50 bg-gold/10" : "border-gold/12"}`}><div className="font-bold">{d}</div>{marked.includes(d) && <div className="mx-auto mt-2 h-1.5 w-1.5 rounded-full bg-gold" />}</div>)}</div></Card>
            <Card shell={shell}>
              <SectionTitle title="Tareas y recordatorios" action={<button onClick={() => setModal("task")} className="rounded-lg bg-gold px-3 py-2 text-sm font-bold text-[#120a00]">Nueva tarea</button>} />
              {tasks.length === 0 ? (
                <div className="py-8 text-center text-cream/40 text-sm">No hay tareas pendientes</div>
              ) : (
                <div className="space-y-3">
                  {tasks.map(t => (
                    <div key={t.id} className="flex items-center gap-3 rounded-lg border border-gold/12 p-3">
                      <button onClick={() => dispatch({ type: "toggleTask", id: t.id })} className={`grid h-8 w-8 shrink-0 place-items-center rounded-lg border ${t.done ? "border-emerald-400 bg-emerald-400 text-black" : "border-gold/30 text-gold"}`}>{t.done && <Check size={16}/>}</button>
                      <div className="min-w-0 flex-1">
                        <div className={`font-bold ${t.done ? "text-cream/45 line-through" : ""}`}>{t.text}</div>
                        <div className="text-xs text-cream/55">Límite: {t.due}</div>
                      </div>
                      <Priority label={t.priority}/>
                      <button onClick={() => handleDelete(t.id, t.text)} className={`rounded-lg p-2 ${deleteConfirm === t.id ? "bg-rose-400 text-black" : "border border-rose-400/30 text-rose-300 hover:bg-rose-400/10"}`} title={deleteConfirm === t.id ? "¿Confirmar?" : "Eliminar"}><X size={14}/></button>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          </div>
        );
      }

      function Social({ posts, shell, setModal, dispatch, notify }) {
        const stats = [{ n: "Instagram", f: "12.8k", e: "5.8%" }, { n: "LinkedIn", f: "4.2k", e: "7.1%" }, { n: "Facebook", f: "8.9k", e: "3.4%" }, { n: "TikTok", f: "19.6k", e: "8.6%" }];
        const [deleteConfirm, setDeleteConfirm] = useState(null);
        
        const handleDelete = (id, title) => {
          if (deleteConfirm === id) {
            dispatch({ type: "deletePost", id });
            notify(`Contenido eliminado`, "success");
            setDeleteConfirm(null);
          } else {
            setDeleteConfirm(id);
            setTimeout(() => setDeleteConfirm(null), 3000);
          }
        };
        
        return (
          <div className="space-y-5">
            <div className="grid gap-4 md:grid-cols-4">{stats.map(s => <Card key={s.n} shell={shell}><MiniStat title={s.n} value={s.f} sub={`${s.e} engagement`} /></Card>)}</div>
            <Card shell={shell}>
              <SectionTitle title="Contenido programado" action={<button onClick={() => setModal("post")} className="rounded-lg bg-gold px-3 py-2 text-sm font-bold text-[#120a00]">Añadir contenido</button>} />
              {posts.length === 0 ? (
                <div className="py-8 text-center text-cream/40 text-sm">No hay contenido programado</div>
              ) : (
                <div className="grid gap-3 lg:grid-cols-2">
                  {posts.map(p => (
                    <div key={p.id} className="rounded-lg border border-gold/12 p-4">
                      <div className="flex items-start justify-between gap-3">
                        <div className="flex-1">
                          <div className="font-extrabold">{p.title}</div>
                          <div className="mt-1 text-sm text-cream/55">{p.network} · {p.date} · alcance {p.reach}</div>
                        </div>
                        <div className="flex items-center gap-2">
                          <Badge label={p.status}/>
                          <button onClick={() => handleDelete(p.id, p.title)} className={`rounded-lg p-2 ${deleteConfirm === p.id ? "bg-rose-400 text-black" : "border border-rose-400/30 text-rose-300 hover:bg-rose-400/10"}`} title={deleteConfirm === p.id ? "¿Confirmar?" : "Eliminar"}><X size={14}/></button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          </div>
        );
      }

      function Reports({ metrics, projects, shell, notify }) {
        const completed = projects.filter(p => p.status === "Completado").length;
        return (
          <div className="space-y-5">
            <div className="grid gap-4 md:grid-cols-4"><Card shell={shell}><MiniStat title="Retención" value="92%" /></Card><Card shell={shell}><MiniStat title="MRR" value={euro.format(metrics.monthly)} /></Card><Card shell={shell}><MiniStat title="Completados" value={completed} /></Card><Card shell={shell}><MiniStat title="En curso" value={metrics.running} /></Card></div>
            <div className="grid gap-5 xl:grid-cols-2"><Card shell={shell}><SectionTitle title="Ingresos por mes" /><Bars /></Card><Card shell={shell}><SectionTitle title="Clientes por servicio" /><Donut data={clientByService}/></Card></div>
            <Card shell={shell}><div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><div><h3 className="text-lg font-extrabold">Informe de rendimiento mensual</h3><p className="text-sm text-cream/60">Crecimiento sólido en servicios recurrentes, con mayor tracción en Web + SEO y Ads.</p></div><button onClick={() => notify("Resumen exportado correctamente")} className="inline-flex items-center justify-center gap-2 rounded-lg bg-gold px-4 py-2 text-sm font-bold text-[#120a00]"><Download size={16}/>Exportar resumen</button></div></Card>
          </div>
        );
      }

      function UsersManagement({ users, dispatch, notify, logActivity, currentUser, shell, isSuperAdmin, mainDispatch }) {
        const [modal, setModal] = useState(null);
        const [form, setForm] = useState({});
        const [deleteConfirm, setDeleteConfirm] = useState(null);
        const [resetTarget, setResetTarget] = useState(null);
        const [resetStep, setResetStep] = useState(0);

        const handleAddUser = () => {
          if (!form.username || !form.password || !form.name) { notify("Complete todos los campos requeridos", "error"); return; }
          if (users.some(u => u.username === form.username)) { notify("El nombre de usuario ya existe", "error"); return; }
          dispatch({ type: "addUser", user: { ...form, initials: form.name.split(" ").map(x => x[0]).join("").slice(0, 2).toUpperCase() } });
          logActivity("Usuario creado", `Nuevo usuario: ${form.name}`);
          notify(`Usuario ${form.name} creado exitosamente`);
          setModal(null); setForm({});
        };

        const handleSetStatus = (id, name, newStatus) => {
          dispatch({ type: "setStatus", id, status: newStatus });
          logActivity("Estado cambiado", `Usuario ${name} → ${newStatus}`);
          notify(`${name}: estado cambiado a ${newStatus}`);
        };

        const handleResetPassword = (id, name) => {
          const newPass = Math.random().toString(36).slice(-8);
          dispatch({ type: "resetPassword", id, newPassword: newPass });
          logActivity("Contraseña reseteada", `Contraseña de ${name} reseteada`);
          notify(`Nueva contraseña para ${name}: ${newPass}`, "success");
        };

        const handleDeleteUser = (id, name) => {
          if (deleteConfirm === id) {
            dispatch({ type: "deleteUser", id });
            logActivity("Usuario eliminado", `Usuario ${name} eliminado`);
            notify(`Usuario ${name} eliminado`);
            setDeleteConfirm(null);
          } else {
            setDeleteConfirm(id);
            setTimeout(() => setDeleteConfirm(null), 3000);
          }
        };

        const startReset = (user) => {
          setResetTarget(user);
          setResetStep(1);
        };

        const confirmReset = () => {
          mainDispatch({ type: "reset" });
          localStorage.removeItem("emprenweb-gestion-v1");
          logActivity("⚠ REINICIO DE DATOS", `Datos de ${resetTarget.name} eliminados por ${currentUser.name}`);
          notify(`Datos de ${resetTarget.name} reiniciados. Cuenta lista para comenzar desde cero.`);
          setResetTarget(null); setResetStep(0);
        };

        const statusBadge = (status) => {
          const map = { activo: "bg-emerald-400/15 text-emerald-300", active: "bg-emerald-400/15 text-emerald-300", inactivo: "bg-zinc-400/15 text-zinc-300", suspendido: "bg-amber-400/15 text-amber-300", blocked: "bg-rose-400/15 text-rose-300" };
          const label = { activo: "Activo", active: "Activo", inactivo: "Inactivo", suspendido: "Suspendido", blocked: "Bloqueado" };
          return <span className={`whitespace-nowrap rounded-full px-2.5 py-1 text-xs font-extrabold ${map[status] || "bg-gold/10 text-gold"}`}>{label[status] || status}</span>;
        };

        const canDeleteUser = (u) => u.id !== currentUser.id && u.level !== "CEO";

        return (
          <div className="space-y-5">
            <Card shell={shell}>
              <div className="flex items-center justify-between">
                <SectionTitle title="Gestión de Usuarios" />
                <button onClick={() => setModal("add")} className="inline-flex items-center gap-2 rounded-lg bg-gold px-3 py-2 text-sm font-bold text-[#120a00]"><Plus size={16}/>Nuevo usuario</button>
              </div>
            </Card>

            <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
              {users.map(u => (
                <Card key={u.id} shell={shell} className={`border-l-4 ${u.level === "CEO" ? "border-l-gold" : u.status === "suspendido" ? "border-l-amber-400" : (u.status === "inactivo" || u.status === "blocked") ? "border-l-rose-400" : "border-l-gold/30"}`}>
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex gap-3">
                      <div className={`grid h-12 w-12 shrink-0 place-items-center rounded-lg font-extrabold ${u.level === "CEO" ? "bg-gold/30 text-softGold" : "bg-gold/20 text-gold"}`}>{u.initials}</div>
                      <div>
                        <div className="flex items-center gap-2">
                          <h3 className="font-extrabold">{u.name}</h3>
                          {u.level === "CEO" && <span className="rounded-full bg-gold/20 px-2 py-0.5 text-xs font-bold text-gold">CEO</span>}
                        </div>
                        <p className="text-sm text-cream/65">{u.role || "Sin cargo"}</p>
                        <p className="text-xs text-gold">@{u.username}</p>
                      </div>
                    </div>
                    {statusBadge(u.status)}
                  </div>
                  <div className="mt-4 grid gap-2 border-t border-gold/15 pt-3 text-xs text-cream/60">
                    <div><span className="font-bold text-gold">Email:</span> {u.email || "No registrado"}</div>
                    <div><span className="font-bold text-gold">Teléfono:</span> {u.phone || "No registrado"}</div>
                    <div><span className="font-bold text-gold">Creado:</span> {u.createdAt}</div>
                    <div><span className="font-bold text-gold">Último acceso:</span> {u.lastLogin ? new Date(u.lastLogin).toLocaleDateString('es-ES') : "Nunca"}</div>
                  </div>
                  <div className="mt-4 flex flex-wrap gap-2">
                    {u.id === currentUser.id ? (
                      <span className="text-xs text-cream/40 italic">Usuario actual</span>
                    ) : (
                      <>
                        {isSuperAdmin && u.status !== "activo" && u.status !== "active" && (
                          <button onClick={() => handleSetStatus(u.id, u.name, "activo")} className="rounded-lg border border-emerald-400/30 px-3 py-1.5 text-xs font-bold text-emerald-300 hover:bg-emerald-400/10">Activar</button>
                        )}
                        {isSuperAdmin && u.status !== "inactivo" && (
                          <button onClick={() => handleSetStatus(u.id, u.name, "inactivo")} className="rounded-lg border border-zinc-400/30 px-3 py-1.5 text-xs font-bold text-zinc-300 hover:bg-zinc-400/10">Desactivar</button>
                        )}
                        {isSuperAdmin && u.status !== "suspendido" && (
                          <button onClick={() => handleSetStatus(u.id, u.name, "suspendido")} className="rounded-lg border border-amber-400/30 px-3 py-1.5 text-xs font-bold text-amber-300 hover:bg-amber-400/10">Suspender</button>
                        )}
                        <button onClick={() => handleResetPassword(u.id, u.name)} className="rounded-lg border border-gold/20 px-3 py-1.5 text-xs font-bold text-gold hover:bg-gold/10">Resetear clave</button>
                        {isSuperAdmin && (
                          <button onClick={() => startReset(u)} className="rounded-lg border border-orange-400/30 px-3 py-1.5 text-xs font-bold text-orange-300 hover:bg-orange-400/10">Reiniciar datos</button>
                        )}
                        {canDeleteUser(u) && (
                          <button onClick={() => handleDeleteUser(u.id, u.name)} className={`rounded-lg px-3 py-1.5 text-xs font-bold ${deleteConfirm === u.id ? "bg-rose-400 text-black" : "border border-rose-400/30 text-rose-300 hover:bg-rose-400/10"}`}>
                            {deleteConfirm === u.id ? "¿Confirmar?" : "Eliminar"}
                          </button>
                        )}
                      </>
                    )}
                  </div>
                </Card>
              ))}
            </div>

            {resetTarget && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/80 p-4">
                <div className="modal-content w-full max-w-md rounded-xl border-2 border-rose-500/50 bg-[#1a0505] p-6 text-cream shadow-[0_0_80px_rgba(239,68,68,.3)]">
                  <div className="flex items-center gap-3 text-rose-300 mb-4"><X size={26} className="shrink-0"/><h2 className="text-xl font-extrabold">⚠ ACCIÓN IRREVERSIBLE</h2></div>
                  {resetStep === 1 && (
                    <>
                      <p className="text-sm leading-6 text-cream/80 mb-2">Estás a punto de <strong>eliminar TODOS los datos comerciales</strong> de <strong className="text-softGold">{resetTarget.name}</strong>:</p>
                      <ul className="text-xs text-cream/65 space-y-1 mb-4 pl-3">
                        {["Clientes", "Proyectos / Negocios", "Facturas", "Tareas", "Publicaciones de redes", "Historial de actividad"].map(item => <li key={item} className="flex items-center gap-2"><span className="text-rose-400">✕</span>{item}</li>)}
                      </ul>
                      <p className="text-xs text-cream/50 mb-5">Los usuarios, contraseñas y configuración general <strong>no serán eliminados</strong>. La cuenta quedará lista para comenzar desde cero.</p>
                      <div className="flex gap-3">
                        <button onClick={() => { setResetTarget(null); setResetStep(0); }} className="flex-1 rounded-lg border border-gold/20 px-4 py-2.5 text-sm font-bold text-gold">Cancelar</button>
                        <button onClick={() => setResetStep(2)} className="flex-1 rounded-lg bg-rose-600 px-4 py-2.5 text-sm font-extrabold text-white hover:bg-rose-500">Continuar →</button>
                      </div>
                    </>
                  )}
                  {resetStep === 2 && (
                    <>
                      <p className="text-sm leading-6 text-cream/90 mb-5">¿Confirmas que deseas <strong className="text-rose-300">reiniciar completamente</strong> los datos de <strong className="text-softGold">{resetTarget.name}</strong>? Esta acción <strong>no se puede deshacer</strong>.</p>
                      <div className="flex gap-3">
                        <button onClick={() => { setResetTarget(null); setResetStep(0); }} className="flex-1 rounded-lg border border-gold/20 px-4 py-2.5 text-sm font-bold text-gold">No, volver atrás</button>
                        <button onClick={confirmReset} className="flex-1 rounded-lg bg-rose-600 px-4 py-2.5 text-sm font-extrabold text-white hover:bg-rose-500 animate-pulse">SÍ, REINICIAR AHORA</button>
                      </div>
                    </>
                  )}
                </div>
              </div>
            )}

            {modal === "add" && (
              <div className="fixed inset-0 z-50 grid place-items-center bg-black/65 p-4">
                <div className="modal-content w-full max-w-xl rounded-lg border border-gold/25 bg-[#1a1100] p-5 text-cream shadow-[0_0_70px_rgba(201,168,76,.18)]">
                  <div className="flex items-center justify-between"><h2 className="text-xl font-extrabold">Nuevo Usuario</h2><button onClick={() => setModal(null)} className="grid h-9 w-9 place-items-center rounded-lg border border-gold/20 text-gold"><X size={18}/></button></div>
                  <div className="mt-5 grid gap-3 sm:grid-cols-2">
                    <label className="sm:col-span-2"><span className="text-xs font-bold text-gold">Nombre completo *</span><input value={form.name || ""} onChange={e => setForm({ ...form, name: e.target.value })} className="mt-1 w-full rounded-lg border border-gold/20 bg-[#120a00] px-3 py-2 text-sm text-cream outline-none focus:border-gold" /></label>
                    <label><span className="text-xs font-bold text-gold">Usuario *</span><input value={form.username || ""} onChange={e => setForm({ ...form, username: e.target.value })} className="mt-1 w-full rounded-lg border border-gold/20 bg-[#120a00] px-3 py-2 text-sm text-cream outline-none focus:border-gold" /></label>
                    <label><span className="text-xs font-bold text-gold">Contraseña *</span><input value={form.password || ""} onChange={e => setForm({ ...form, password: e.target.value })} type="password" className="mt-1 w-full rounded-lg border border-gold/20 bg-[#120a00] px-3 py-2 text-sm text-cream outline-none focus:border-gold" /></label>
                    <label><span className="text-xs font-bold text-gold">Email</span><input value={form.email || ""} onChange={e => setForm({ ...form, email: e.target.value })} className="mt-1 w-full rounded-lg border border-gold/20 bg-[#120a00] px-3 py-2 text-sm text-cream outline-none focus:border-gold" /></label>
                    <label><span className="text-xs font-bold text-gold">Teléfono</span><input value={form.phone || ""} onChange={e => setForm({ ...form, phone: e.target.value })} className="mt-1 w-full rounded-lg border border-gold/20 bg-[#120a00] px-3 py-2 text-sm text-cream outline-none focus:border-gold" /></label>
                    <label className="sm:col-span-2"><span className="text-xs font-bold text-gold">Cargo / Rol</span><input value={form.role || ""} onChange={e => setForm({ ...form, role: e.target.value })} placeholder="Ej: Gerente Comercial, Vendedor Senior, Dueño..." className="mt-1 w-full rounded-lg border border-gold/20 bg-[#120a00] px-3 py-2 text-sm text-cream outline-none focus:border-gold" /></label>
                  </div>
                  <div className="mt-5 flex justify-end gap-2"><button onClick={() => setModal(null)} className="rounded-lg border border-gold/20 px-4 py-2 text-sm font-bold text-gold">Cancelar</button><button onClick={handleAddUser} className="rounded-lg bg-gold px-4 py-2 text-sm font-bold text-[#120a00]">Crear usuario</button></div>
                </div>
              </div>
            )}
          </div>
        );
      }

      function SettingsPage({ shell, light, setLight, notify, dispatch, settings, settingsDispatch, canManageSettings, activityLog, activityDispatch, isSuperAdmin }) {
        const [form, setForm] = useState(settings);
        
        const handleSaveSettings = () => {
          settingsDispatch({ type: "updateSettings", data: form });
          notify("Configuración guardada exitosamente");
        };
        
        const handleClearActivity = () => {
          activityDispatch({ type: "clearActivity" });
          notify("Historial de actividad eliminado");
        };
        
        return (
          <div className="grid gap-5 xl:grid-cols-2">
            <Card shell={shell}>
              <SectionTitle title="Datos de empresa" />
              <div className="space-y-3">
                <Field label="Nombre de empresa" value={form.companyName} onChange={v => setForm({ ...form, companyName: v })} />
                <Field label="Teléfono" value={form.companyPhone} onChange={v => setForm({ ...form, companyPhone: v })} />
                <Field label="Email" value={form.companyEmail} onChange={v => setForm({ ...form, companyEmail: v })} />
                <Field label="Instagram" value={form.companyInstagram} onChange={v => setForm({ ...form, companyInstagram: v })} />
                <Field label="Dirección" value={form.companyAddress} onChange={v => setForm({ ...form, companyAddress: v })} />
                <Field label="NIF/CIF" value={form.companyTaxId} onChange={v => setForm({ ...form, companyTaxId: v })} />
              </div>
              {canManageSettings && <button onClick={handleSaveSettings} className="mt-5 rounded-lg bg-gold px-4 py-2 text-sm font-bold text-[#120a00]">Guardar cambios</button>}
            </Card>
            <Card shell={shell}>
              <SectionTitle title="Preferencias del sistema" />
              <div className="space-y-3">
                <Field label="Prefijo facturas" value={form.invoicePrefix} onChange={v => setForm({ ...form, invoicePrefix: v })} />
                <Field label="Próximo número factura" value={String(form.nextInvoiceNumber)} onChange={v => setForm({ ...form, nextInvoiceNumber: Number(v) })} />
                <Field label="Moneda" value={form.currency} onChange={v => setForm({ ...form, currency: v })} />
                <Field label="Zona horaria" value={form.timezone} onChange={v => setForm({ ...form, timezone: v })} />
              </div>
              <SettingRow title="Notificaciones" enabled={form.notificationsEnabled} onClick={() => setForm({ ...form, notificationsEnabled: !form.notificationsEnabled })} />
              <SettingRow title="Backup automático" enabled={form.autoBackup} onClick={() => setForm({ ...form, autoBackup: !form.autoBackup })} />
              <SettingRow title="Tema claro" enabled={light} onClick={() => setLight(!light)} />
              {canManageSettings && <button onClick={handleSaveSettings} className="mt-4 rounded-lg bg-gold px-4 py-2 text-sm font-bold text-[#120a00]">Guardar preferencias</button>}
            </Card>
            <Card shell={shell} className="xl:col-span-2">
              <SectionTitle title="Historial de actividad reciente" action={canManageSettings && <button onClick={handleClearActivity} className="rounded-lg border border-rose-400/30 px-3 py-1.5 text-xs font-bold text-rose-300 hover:bg-rose-400/10">Limpiar historial</button>} />
              {activityLog.length === 0 ? (
                <div className="py-8 text-center text-cream/40 text-sm">No hay actividad registrada</div>
              ) : (
                <div className="mt-4 max-h-80 overflow-y-auto space-y-2">
                  {activityLog.map(log => (
                    <div key={log.id} className="flex items-center gap-3 rounded-lg border border-gold/12 bg-black/10 p-3 text-sm">
                      <div className="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-gold/12 text-gold"><Activity size={14}/></div>
                      <div className="flex-1">
                        <div className="font-bold">{log.action}</div>
                        <div className="text-xs text-cream/55">{log.details}</div>
                      </div>
                      <div className="text-xs text-cream/40">{new Date(log.timestamp).toLocaleString('es-ES')}</div>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          </div>
        );
      }

      function Modal({ type, setModal, dispatch, notify }) {
        const [form, setForm] = useState({});
        const [errors, setErrors] = useState({});
        
        const validate = () => {
          const newErrors = {};
          if (type === "client") {
            if (!form.name?.trim()) newErrors.name = "Requerido";
            if (!form.company?.trim()) newErrors.company = "Requerido";
            if (!form.email?.trim()) newErrors.email = "Requerido";
            if (form.value && isNaN(Number(form.value))) newErrors.value = "Debe ser un número";
          } else if (type === "task") {
            if (!form.text?.trim()) newErrors.text = "Requerido";
          } else if (type === "invoice") {
            if (!form.client?.trim()) newErrors.client = "Requerido";
            if (!form.amount || isNaN(Number(form.amount))) newErrors.amount = "Debe ser un número";
          } else if (type === "post") {
            if (!form.title?.trim()) newErrors.title = "Requerido";
          }
          setErrors(newErrors);
          return Object.keys(newErrors).length === 0;
        };
        
        const title = { client: "Nuevo cliente", task: "Nueva tarea", invoice: "Nueva factura", post: "Nuevo contenido" }[type];
        
        const save = () => {
          if (!validate()) {
            notify("Complete los campos requeridos", "error");
            return;
          }
          if (type === "client") dispatch({ type: "addClient", client: { name: form.name, company: form.company, service: form.service || "Web + SEO", status: form.status || "Prospecto", email: form.email, phone: form.phone || "600 000 000", value: Number(form.value || 1200), notes: form.notes || "Pendiente de primera reunión." } });
          if (type === "task") dispatch({ type: "addTask", task: { text: form.text, due: form.due || new Date().toISOString().split("T")[0], priority: form.priority || "Media" } });
          if (type === "invoice") dispatch({ type: "addInvoice", invoice: { client: form.client, amount: Number(form.amount), status: form.status || "Pendiente", date: form.date || new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }) } });
          if (type === "post") dispatch({ type: "addPost", post: { network: form.network || "Instagram", title: form.title, date: form.date || "Próxima semana", status: form.status || "Programado", reach: form.reach || "0" } });
          notify(`${title} guardado`);
          setModal(null);
          setForm({});
          setErrors({});
        };
        
        const fields = {
          client: [
            { key: "name", label: "Nombre *", full: true },
            { key: "company", label: "Empresa *", full: true },
            { key: "service", label: "Servicio", full: false },
            { key: "status", label: "Estado", full: false },
            { key: "email", label: "Email *", full: true },
            { key: "phone", label: "Teléfono", full: false },
            { key: "value", label: "Valor mensual", full: false, type: "number" },
            { key: "notes", label: "Notas", full: true },
          ],
          invoice: [
            { key: "client", label: "Cliente *", full: true },
            { key: "amount", label: "Importe *", full: false, type: "number" },
            { key: "date", label: "Fecha", full: false },
            { key: "status", label: "Estado", full: false },
          ],
          post: [
            { key: "network", label: "Red social", full: false },
            { key: "title", label: "Título *", full: true },
            { key: "date", label: "Fecha", full: false },
            { key: "status", label: "Estado", full: false },
            { key: "reach", label: "Alcance estimado", full: false },
          ],
          task: [
            { key: "text", label: "Descripción *", full: true },
            { key: "due", label: "Fecha límite", full: false },
            { key: "priority", label: "Prioridad", full: false },
          ],
        };
        
        return (
          <div className="fixed inset-0 z-50 grid place-items-center bg-black/65 p-4">
            <div className="modal-content w-full max-w-xl rounded-lg border border-gold/25 bg-[#1a1100] p-5 text-cream shadow-[0_0_70px_rgba(201,168,76,.18)]">
              <div className="flex items-center justify-between"><h2 className="text-xl font-extrabold">{title}</h2><button onClick={() => { setModal(null); setForm({}); setErrors({}); }} className="grid h-9 w-9 place-items-center rounded-lg border border-gold/20 text-gold"><X size={18}/></button></div>
              <div className="mt-5 grid gap-3 sm:grid-cols-2">
                {(fields[type] || []).map(field => (
                  <label key={field.key} className={field.full ? "sm:col-span-2" : ""}>
                    <span className="text-xs font-bold text-gold">{field.label}</span>
                    <input 
                      value={form[field.key] || ""} 
                      onChange={e => setForm({ ...form, [field.key]: e.target.value })}
                      type={field.type || "text"}
                      className={`mt-1 w-full rounded-lg border px-3 py-2 text-sm text-cream outline-none focus:border-gold ${errors[field.key] ? "border-rose-400" : "border-gold/20 bg-[#120a00]"}`}
                    />
                    {errors[field.key] && <span className="mt-1 text-xs text-rose-300">{errors[field.key]}</span>}
                  </label>
                ))}
              </div>
              <div className="mt-5 flex justify-end gap-2">
                <button onClick={() => { setModal(null); setForm({}); setErrors({}); }} className="rounded-lg border border-gold/20 px-4 py-2 text-sm font-bold text-gold">Cancelar</button>
                <button onClick={save} className="rounded-lg bg-gold px-4 py-2 text-sm font-bold text-[#120a00]">Guardar</button>
              </div>
            </div>
          </div>
        );
      }

      function ChartRevenue() {
        return <div className="h-[300px]"><ResponsiveContainer width="100%" height="100%"><AreaChart data={revenueData}><defs><linearGradient id="goldArea" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#c9a84c" stopOpacity={0.55}/><stop offset="95%" stopColor="#c9a84c" stopOpacity={0}/></linearGradient></defs><CartesianGrid stroke="#c9a84c18" vertical={false}/><XAxis dataKey="month" stroke="#f5e6c888"/><YAxis stroke="#f5e6c888"/><Tooltip contentStyle={{ background: "#1a1100", border: "1px solid #c9a84c44", borderRadius: 8, color: "#f5e6c8" }}/><Area type="monotone" dataKey="revenue" stroke="#f0d080" fill="url(#goldArea)" strokeWidth={3}/></AreaChart></ResponsiveContainer></div>;
      }

      function Bars() {
        return <div className="h-[300px]"><ResponsiveContainer width="100%" height="100%"><BarChart data={revenueData}><CartesianGrid stroke="#c9a84c18" vertical={false}/><XAxis dataKey="month" stroke="#f5e6c888"/><YAxis stroke="#f5e6c888"/><Tooltip contentStyle={{ background: "#1a1100", border: "1px solid #c9a84c44", borderRadius: 8, color: "#f5e6c8" }}/><Bar dataKey="revenue" radius={[8,8,0,0]} fill="#c9a84c"/></BarChart></ResponsiveContainer></div>;
      }

      function Donut({ data }) {
        const colors = ["#c9a84c", "#f0d080", "#86efac", "#fb7185"];
        return <div className="h-[280px]"><ResponsiveContainer width="100%" height="100%"><PieChart><Pie data={data} dataKey="value" nameKey="name" innerRadius={62} outerRadius={96} paddingAngle={4}>{data.map((_, i) => <Cell key={i} fill={colors[i % colors.length]} />)}</Pie><Tooltip contentStyle={{ background: "#1a1100", border: "1px solid #c9a84c44", borderRadius: 8, color: "#f5e6c8" }}/></PieChart></ResponsiveContainer></div>;
      }

      function LoadingGrid({ shell }) {
        return <div className="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">{Array.from({ length: 8 }).map((_, i) => <div key={i} className={`h-36 animate-pulse rounded-lg border ${shell}`} />)}</div>;
      }

      function SectionTitle({ title, action }) {
        return <div className="mb-4 flex items-center justify-between gap-3"><h2 className="text-lg font-extrabold">{title}</h2>{action}</div>;
      }
      function MiniStat({ title, value, sub, tone = "gold" }) {
        const color = tone === "green" ? "text-emerald-300" : tone === "red" ? "text-rose-300" : "text-softGold";
        return <div><p className="text-sm text-cream/60">{title}</p><div className={`mt-2 text-2xl font-extrabold ${color}`}>{value}</div>{sub && <p className="mt-1 text-xs text-cream/50">{sub}</p>}</div>;
      }
      function ActivityList() {
        return <div className="py-8 text-center text-cream/40 text-sm">No hay actividad reciente registrada.</div>;
      }
      function AlertList() {
        return <div className="py-6 text-center text-cream/40 text-sm">No hay alertas activas.</div>;
      }
      function Avatar({ label }) { return <div className="grid h-12 w-12 shrink-0 place-items-center rounded-lg border border-gold/25 bg-gold/12 font-extrabold text-softGold">{label}</div>; }
      function LogoMark({ size = "h-11 w-11", loginVariant = false }) {
        return (
          <div className={`relative shrink-0 overflow-visible rounded-lg border border-gold/40 bg-gold/10 ${loginVariant ? "logo-login-animated" : "logo-animated"} ${size}`}>
            <div className="logo-img-bg h-full w-full rounded-lg" style={{padding:"6%"}} />
          </div>
        );
      }
      function Info({ label, value }) { return <div><div className="text-xs font-bold text-gold">{label}</div><div className="mt-1 truncate text-sm text-cream/70">{value}</div></div>; }
      function Field({ label, value, onChange }) { return <label className="block"><span className="text-xs font-bold text-gold">{label}</span><input value={value} onChange={e => onChange && onChange(e.target.value)} className="mt-1 w-full rounded-lg border border-gold/20 bg-black/10 px-3 py-2 text-sm text-cream outline-none focus:border-gold"/></label>; }
      function SettingRow({ title, enabled, onClick }) { return <button onClick={onClick} className="flex w-full items-center justify-between border-b border-gold/12 py-4 text-left"><span className="font-bold">{title}</span><span className={`h-6 w-11 rounded-full p-1 transition ${enabled ? "bg-gold" : "bg-cream/20"}`}><span className={`block h-4 w-4 rounded-full bg-[#120a00] transition ${enabled ? "translate-x-5" : ""}`} /></span></button>; }
      function Badge({ label }) {
        const styles = { Activo: "bg-emerald-400/15 text-emerald-300", Activa: "bg-emerald-400/15 text-emerald-300", Prospecto: "bg-sky-400/15 text-sky-300", Pausado: "bg-zinc-400/15 text-zinc-300", Finalizado: "bg-purple-400/15 text-purple-300", Pagada: "bg-emerald-400/15 text-emerald-300", Pendiente: "bg-yellow-400/15 text-yellow-300", Vencida: "bg-rose-400/15 text-rose-300", Programado: "bg-yellow-400/15 text-yellow-300", Publicado: "bg-emerald-400/15 text-emerald-300", Borrador: "bg-zinc-400/15 text-zinc-300" };
        return <span className={`whitespace-nowrap rounded-full px-2.5 py-1 text-xs font-extrabold ${styles[label] || "bg-gold/10 text-gold"}`}>{label}</span>;
      }
      function Priority({ label }) {
        const styles = { Alta: "bg-rose-400/15 text-rose-300", Media: "bg-yellow-400/15 text-yellow-300", Baja: "bg-emerald-400/15 text-emerald-300" };
        return <span className={`rounded-full px-2 py-1 text-xs font-extrabold ${styles[label]}`}>{label}</span>;
      }

      createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
